<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pokémon Battle</title>
    <link rel="stylesheet" href="styles.css" />
    <link rel="stylesheet" href="dashboard.css" />
    <link rel="stylesheet" href="pokemon.css" />
  </head>
  <body>
    <header>
      <img
        src="./assets/image.png"
        alt="TechMahindra Logo"
        width="150"
        height="50"
      />
    </header>
    <div class="dashboard-container">
      <div class="pokemon-search-wrapper">
        <div class="pokemon-search-header">
          <h2>Pokémon Battle</h2>
          <p>Turn-based duel between your selected Pokémon.</p>
        </div>

        <button
          type="button"
          class="pokemon-search-button"
          onclick="window.location.href = 'pokemon.html'"
          style="margin-bottom: 1rem"
        >
          ← Back to directory
        </button>

        <div
          id="pokemon-battle-error"
          class="pokemon-error"
          style="margin-bottom: 0.75rem"
        ></div>

        <section id="pokemon-battle-root" class="pokemon-battle-page">
          <div class="pokemon-battle-arena">
            <div id="pokemon-battle-left" class="pokemon-battle-side"></div>
            <div id="pokemon-battle-right" class="pokemon-battle-side"></div>
          </div>

          <div id="pokemon-battle-log" class="pokemon-battle-log"></div>
        </section>
      </div>
    </div>

    <script src="auth-validation.js"></script>
    <script src="pokemon-battle.js"></script>
    <script>
      document.addEventListener("DOMContentLoaded", () => {
        AuthValidation.requireAuth();
        PokemonBattlePage.init();
      });
    </script>
  </body>
</html>
